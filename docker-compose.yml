services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_PATH: artifacts/serving.db
      MODEL_PATH: artifacts/model.joblib
      DQ_PATH: artifacts/dq_report.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
